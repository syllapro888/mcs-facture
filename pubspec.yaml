name: mcs_facture
description: MCS VISION - factures et devis professionnels (hors ligne).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: any
  path: any
  path_provider: any
  provider: any
  pdf: any
  printing: any
  image_picker: any
  file_picker: ^13.3.0
  package_info_plus: any
  url_launcher: any
  http: any
  sqflite_common_ffi_web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FFFFFF"
    theme_color: "#0B2A5B"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/logo/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
