name: MCS Boutique (Android + site iPhone)

on:
  push:
    branches: [main]
    paths:
      - 'boutique/**'
      - 'firestore.rules'
      - '.github/workflows/boutique.yml'
  pull_request:
    paths:
      - 'boutique/**'
      - 'firestore.rules'
      - '.github/workflows/boutique.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: boutique

jobs:
  build:
    name: Construire MCS Boutique
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer android/ et web/
        run: bash tool/prepare_platforms.sh

      - name: Dépendances
        run: flutter pub get

      - name: Icône
        run: dart run flutter_launcher_icons

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      # Même clé que MCS Facture : les mises à jour s'installent par-dessus.
      - name: Clé de signature
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEY_B64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_B64 est manquant."
            exit 1
          fi
          printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore

      - name: Construire l'APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --build-name=$VERSION --build-number=${{ github.run_number }} 2>&1 | tee apk_build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A6 "What went wrong|Error:|error:|FAILURE|requires|incompatible" apk_build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=APK::${msg}"
          fi
          exit $status

      - name: Vérifier la clé de signature
        run: |
          EXPECTED=96fffb593c8e7e6c48987edda39e9874f164ad38ce6b7eb0b706c22cd0b4c128
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          GOT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error title=Signature::APK signé avec une autre clé ($GOT)."
            exit 1
          fi

      - name: Construire le site (iPhone)
        run: flutter build web --release --build-name=$VERSION --build-number=${{ github.run_number }}

      # Le forfait gratuit de Firebase refuse les fichiers .apk : le lien
      # https://mcs-vision.web.app/download/MCS-Boutique.apk redirige vers
      # le fichier publié dans la version « boutique » (voir firebase.json).
      - name: Nommer l'APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MCS-Boutique-v$VERSION.apk
          cp build/app/outputs/flutter-apk/app-release.apk MCS-Boutique.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mcs-boutique
          path: |
            boutique/MCS-Boutique-v${{ env.VERSION }}.apk
            boutique/build/web

      # Les règles Firestore sont publiées à la main dans la console Firebase
      # (le compte de service n'a pas le droit de les modifier).
      - name: Mettre en ligne sur Firebase Hosting
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning title=Firebase::Secret FIREBASE_SERVICE_ACCOUNT absent : site non mis en ligne."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project mcs-vision --non-interactive

      # Version de secours dans « Releases » (marquée pré-version pour ne pas
      # gêner les mises à jour de MCS Facture).
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: boutique-v${{ env.VERSION }}
          name: MCS Boutique v${{ env.VERSION }}
          prerelease: true
          body: Application cliente MCS Boutique (Android).
          files: boutique/MCS-Boutique-v${{ env.VERSION }}.apk

      # Lien fixe pour le téléchargement depuis le site.
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: boutique
          name: MCS Boutique (dernière version)
          prerelease: true
          body: Dernière version de MCS Boutique pour Android.
          files: boutique/MCS-Boutique.apk
          overwrite_files: true
